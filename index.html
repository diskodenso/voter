<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://kit.fontawesome.com/473f2b9b8e.js"
      crossorigin="anonymous"
    ></script>
    <title>Voter App</title>
  </head>
  <body>

    <div id="app">
    <div class="container-fluid">
      <div class="row">
        <div class="col-xl-4 offset-xl-4">
          <div class="card mt-4">
            <div class="card-header">
              <h2 class="card-title">Vote now!
                <span class="float-end">{{totalVotes()}}Stimmen</span>
              </h2>
            </div>
            <div class="card-body">
              <div class="d-flex">
                <div class="d-shrink-0">
                  <img src="https://via.placeholder.com/60" alt="" />
                </div>
                <div class="flex-grow-1 ms-3">
                  <!-- <h5>
                    {{submissions[0].title}}
                    <span
                      class="float-end text-primary"
                      v-on:click.right="upvote($event ), logConsole(`Stimme abgegeben`)"
                      style="cursor: pointer"
                    >
                      <i class="fa fa-chevron-up"></i>
                      <strong>{{submissions[0].votes}}</strong>
                    </span>-->
                    <span
                    class="float-end text-primary"
                    v-on:click="upvote()"
                    style="cursor: pointer"
                  >
                    <i class="fa fa-chevron-up"></i>
                    <strong>{{submissions[0].votes}}</strong>
                  </span>
                  </h5>
                  <!-- <div>{{submissions[0].desc}}</div> -->
                  <div v-html="submissions[0].desc"></div>
                  <div v-pre>{{submissions[0].desc}}</div>
                  <small class="text-muted">selected by {{submissions[0].author}}</small>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!--<VUE import via CDN-->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="seed.js"></script>
    <script src="app.js"></script>
  </body>
</html>
